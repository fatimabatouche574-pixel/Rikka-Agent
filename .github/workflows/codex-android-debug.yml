name: Codex Android Debug

on:
  workflow_dispatch:
  push:
    branches: [codex-android-integration]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - name: Prepare pinned Codex-VL ARM64 runtime
        run: bash scripts/prepare-codex-vl-runtime.sh
      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Verify bundled runtime and APK
        run: |
          test -x app/src/main/jniLibs/arm64-v8a/libcodex_vl.so
          test -x app/src/main/jniLibs/arm64-v8a/libcodex_code_mode_host.so
          find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: rikka-agent-codex-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
